<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="chat.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" <link rel="stylesheet" href="/output.css">


    <title>Hono Chat</title>
</head>

<body class="m-0 p-0 md:p-6 bg-blue-300">

    <div class="grid grid-cols-1 md:grid-cols-[1fr_4fr] h-dvh md:h-[cal(100dvh-3rem)] w-full min-w-0 overflow-hidden">

        <aside id="sidebar" class="bg-white px-4 md:px-10 min-w-0 overflow-y-auto rounded-l-xl">
            <div class="flex items-center gap-1.5 mt-6">
                <div class="w-10 h-10 bg-[#7c3aed] rounded-xl flex justify-center items-center">
                    <img src="/images/messenger.png" class="w-6 h-6 object-contain brightness-0 invert" alt="">
                </div>
                <div>
                    <h1><strong>Hono Chat</strong></h1>
                    <p>Stay Connected</p>
                </div>

            </div>
            <button type="button" class="flex items-center gap-1.5 bg-[#F7F8FD] w-full rounded-2xl h-19 px-4 mt-6">
                <div class="w-10 h-10 bg-[#7c3aed] rounded-full flex justify-center items-center">
                    <p class="w-6 h-6 object-contain brightness-0 invert">FD</p>
                </div>
                <div>
                    <h1><strong>Fatih Demir</strong></h1>
                    <p>Available</p>
                </div>

            </button>
            <div class="flex items-center mt-5 bg-gray-200 border border-gray-200 p-2 rounded-xl">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-search preview-icon">
                        <path d="m21 21-4.34-4.34" />
                        <circle cx="11" cy="11" r="8" />
                    </svg></span>
                <input id="searchConversations" type="search" placeholder="Search Conversations"
                    class="flex-1 min-w-0 bg-transparent outline-none">

                <span class="text-gray-400 bg-white rounded-l px-1">⌘ K</span>

            </div>

            <div class="flex gap-2 mt-5 mb-3">
                <span class="text-[#7B8199]">Online Now

                </span>
                <span>
                    3
                </span>



            </div>
            <div class="flex gap-2">
                <button
                    class="flex flex-col w-12 h-12 rounded-full overflow-hidden flex bg-fuchsia-500 items-center justify-center">
                    <figure>AD</figure>



                </button>
                <div class="w-12 h-12 rounded-full overflow-hidden flex bg-blue-200 items-center justify-center">
                    <span class="">SM</span>

                </div>
                <div class="w-12 h-12 rounded-full overflow-hidden flex bg-cyan-500 items-center justify-center">
                    <span class="">LE</span>

                </div>

            </div>

            <section class="mt-5">
                <div class="flex justify-between">
                    <h2>Messages</h2>
                    <button class="">...</button>
                </div>
                <button type="button" data-user="fatih"
                    class="chat-user flex items-center gap-1.5 w-full rounded-2xl h-19 px-4 mt-6 hover:bg-purple-100">
                    <div class="w-10 h-10 bg-[#7c3aed] rounded-full flex justify-center items-center">
                        <p class="w-6 h-6 object-contain brightness-0 invert">FD</p>
                    </div>
                    <div>
                        <h1><strong>Fatih</strong></h1>
                        <p>Lorem ipsum dolor....</p>
                    </div>

                </button>
                <button type="button" data-user="vlad"
                    class="chat-user flex items-center gap-1.5 w-82 rounded-2xl h-19 px-4 mt-6 hover:bg-purple-100">
                    <div class="w-10 h-10 bg-[#7c3aed] rounded-full flex justify-center items-center">
                        <p class="w-6 h-6 object-contain brightness-0 invert">V</p>
                    </div>
                    <div>
                        <h1><strong>Vlad</strong></h1>
                        <p>...</p>
                    </div>

                </button>
                <button type="button" data-user="sarah"
                    class="chat-user flex items-center gap-1.5 w-full rounded-2xl h-19 px-4 mt-6 hover:bg-purple-100 cursor-pointer text-left">
                    <div class="w-10 h-10 bg-[#7c3aed] rounded-full flex justify-center items-center">
                        <p class="w-6 h-6 object-contain brightness-0 invert">SM</p>
                    </div>
                    <div>
                        <h1><strong>Sarah Miller</strong></h1>
                        <p>Thanks for the Update....</p>
                    </div>

                </button>
                <button type="button" data-user="development"
                    class="chat-user flex items-center gap-1.5 w-82 rounded-2xl h-19 px-4 mt-6 hover:bg-purple-200 cursor-pointer text-left">
                    <div class="w-10 h-10 bg-[#7c3aed] rounded-full flex justify-center items-center">
                        <p class="w-6 h-6 object-contain brightness-0 invert">DT</p>
                    </div>
                    <div>
                        <h1><strong>Development Team</strong></h1>
                        <p>Lorem ipsum dolor....</p>
                    </div>

                </button>
            </section>


        </aside>

        <div id="chatView"
            class="hidden md:grid grid-rows-[auto_minmax(0,1fr)_auto] h-full min-h-0 min-w-0 w-full overflow-hidden">
            <header class="p-4 border-b bg-white flex justify-between items-center rounded-r-xl">
                <div class="flex items-center gap-1.5 bg-[#F7F8FD] w-full rounded-2xl h-19 px-4">
                    <button type="button" onclick="backToContacts()"
                        class="md:hidden flex items-center justify-center w-6 h-10 shrink-0 cursor-pointer text-xl">
                        ←
                    </button>
                    <div class="w-10 h-10 bg-slate-700 rounded-full flex justify-center items-center">
                        <p class="w-6 h-6 object-contain brightness-0 invert">FD</p>
                    </div>
                    <div>
                        <button id="backButton" class="md:hidden text-purple-600 text-2xl"
                            aria-label="Back to contacts"></button>
                        <h1 id="chatHeaderName"><strong>Adem Demir</strong></h1>
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                            <p>Online Now</p>
                        </div>
                    </div>


                </div>
                <div class="flex gap-4"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                        <g id="SVGRepo_iconCarrier">
                            <path
                                d="M18 9V6M18 6V3M18 6H15M18 6H21M18.5 21C9.93959 21 3 14.0604 3 5.5C3 5.11378 3.01413 4.73086 3.04189 4.35173C3.07375 3.91662 3.08968 3.69907 3.2037 3.50103C3.29814 3.33701 3.4655 3.18146 3.63598 3.09925C3.84181 3 4.08188 3 4.56201 3H7.37932C7.78308 3 7.98496 3 8.15802 3.06645C8.31089 3.12515 8.44701 3.22049 8.55442 3.3441C8.67601 3.48403 8.745 3.67376 8.88299 4.05321L10.0491 7.26005C10.2096 7.70153 10.2899 7.92227 10.2763 8.1317C10.2643 8.31637 10.2012 8.49408 10.0942 8.64506C9.97286 8.81628 9.77145 8.93713 9.36863 9.17882L8 10C9.2019 12.6489 11.3501 14.7999 14 16L14.8212 14.6314C15.0629 14.2285 15.1837 14.0271 15.3549 13.9058C15.5059 13.7988 15.6836 13.7357 15.8683 13.7237C16.0777 13.7101 16.2985 13.7904 16.74 13.9509L19.9468 15.117C20.3262 15.255 20.516 15.324 20.6559 15.4456C20.7795 15.553 20.8749 15.6891 20.9335 15.842C21 16.015 21 16.2169 21 16.6207V19.438C21 19.9181 21 20.1582 20.9007 20.364C20.8185 20.5345 20.663 20.7019 20.499 20.7963C20.3009 20.9103 20.0834 20.9262 19.6483 20.9581C19.2691 20.9859 18.8862 21 18.5 21Z"
                                stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </g>
                    </svg>
                    <svg class="w-5 h-5" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg"
                        xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" enable-background="new 0 0 32 32"
                        xml:space="preserve" fill="#000000">
                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                        <g id="SVGRepo_iconCarrier">
                            <polygon fill="none" stroke="#000000" stroke-width="2" stroke-miterlimit="10"
                                points="23,19 23,13 29,10 29,22 "></polygon>
                            <rect x="3" y="9" fill="none" stroke="#000000" stroke-width="2" stroke-miterlimit="10"
                                width="20" height="14"></rect>
                        </g>
                    </svg>
                </div>

            </header>

            <main id="chatPanel" class="chatPanel"
                class="flex flex-col min-h-0 min-w-0 w-full overflow-y-auto bg-[#f8f7ff] bg-[radial-gradient(#ddd6fe_1px,transparent_1px)] bg-[size:20px_20px]">

                <div class="flex flex-col">
                    <p class="w-fit self-center rounded-2xl bg-white px-3 mt-2 mb-3">Today</p>
                    <p class="text-center">Messages are end-to-end encrypted. Only people in this chat can read them.
                    </p>
                </div>
                <div id="chatMessages" class="flex flex-col gap-3 p-4"> </div>

            </main>

            <footer class="flex items-center gap-2 bg-white p-3 w-full">
                <button>📎</button>
                <div class="flex items-center rounded-l-lg bg-gray-100 p-3 border border-gray-200 ">
                    <input id="messageInput" placeholder="Type a message..." type="Type a message" id="messageInput"
                        placeholder="Type a message..." class="w-full min-w-0 bg-transparent outline-none text-base">
                    <img class="" src="/public/images/happy.png" alt="">
                </div>

                <button id="sendButton" type="button" class="shrink-0 bg-[#1E293B] text-white px-4 py-3 rounded-lgs"
                    id="sendButton">Send</button>
            </footer>
        </div>
    </div>




</body>

</html>
